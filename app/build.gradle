apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'

def versionMajor = 1
def versionMinor = 0
def versionPatch = 0
def versionBuild = 12 // sequential release number (r1, r2, ...) — bump on every release

android {
    namespace 'org.dlget'
    compileSdkVersion 35

    defaultConfig {
        applicationId "org.dlget"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode versionMajor * 1000000 + versionMinor * 10000 + versionPatch * 100 + versionBuild
        // versionName tracks the release number so the version shown by Android
        // can never drift from the rN release numbering (r4 -> "1.4")
        versionName "${versionMajor}.${versionBuild}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }

        ndk {
            abiFilters = []
            abiFilters.addAll(ABI_FILTERS.split(';').collect { it as String })
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    splits {
        abi {
            enable !project.hasProperty('noSplits')
            reset()
            include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }
}

dependencies {
    def nav_version = "2.7.7"
    def material_version = "1.12.0"
    def room_version = "2.7.2"
    def lifecycle_version = "2.8.4"
    def coroutines_version = "1.8.1"
    def work_version = "2.11.2"
    def coil_version = "2.6.0"
    def commonsIoVer = "2.16.1"

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // Kotlin components
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    implementation "com.google.android.material:material:$material_version"
    implementation "androidx.preference:preference:1.2.1"

    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // Lifecycle components
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    implementation "androidx.work:work-runtime-ktx:$work_version"

    // JitPack purged the 'common' artifact this POM depends on -> exclude and use local :common module
    implementation project(':library')
    implementation project(':common')
    implementation project(':ffmpeg')

    implementation "io.coil-kt:coil:$coil_version"

    implementation group: 'commons-io', name: 'commons-io', version: "$commonsIoVer"

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}