services:
  the-hand-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: the-hand-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      JOB_RETENTION_MS: "3600000"
      MAX_ACTIVE_JOBS: "2"
      MAX_DOWNLOAD_BYTES: "4294967296"
    volumes:
      - the-hand-jobs:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  the-hand-jobs:
